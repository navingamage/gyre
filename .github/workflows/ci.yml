name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Deploying needs Cloudflare credentials and a real database_id in
      # wrangler.toml (see DEPLOY.md). Until those exist, skip rather than
      # fail — a red build should mean the code is broken, not that the
      # project hasn't been provisioned yet.
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials not set — skipping deploy. See DEPLOY.md."
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.configured == 'true'
      - run: npm run build
        if: steps.creds.outputs.configured == 'true'

      # Applies any new SQL files under migrations/ to the production D1
      # database — a no-op once there are no new migrations to apply.
      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply gyre-db --remote

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        run: npx wrangler pages deploy dist --project-name=gyre --branch=main
